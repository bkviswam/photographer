# Secret
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: {{ target_namespace }}
type: Opaque
stringData:
  DB_USER: photographer
  DB_PASSWORD: photographer
  DB_NAME: photographer
  MYSQL_ROOT_PASSWORD: rootpass

---
# (Optional) PVC for persistence; remove if you prefer ephemeral
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: {{ target_namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 10Gi } }
  storageClassName: local-path

---
# MySQL Deployment + Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: {{ target_namespace }}
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_DATABASE     ; valueFrom: { secretKeyRef: { name: db-secret, key: DB_NAME } }
            - name: MYSQL_USER         ; valueFrom: { secretKeyRef: { name: db-secret, key: DB_USER } }
            - name: MYSQL_PASSWORD     ; valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD; valueFrom: { secretKeyRef: { name: db-secret, key: MYSQL_ROOT_PASSWORD } }
          ports: [{ containerPort: 3306 }]
          readinessProbe:
            exec: { command: ["bash","-lc","mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["bash","-lc","mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim: { claimName: mysql-data }

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ target_namespace }}
spec:
  selector: { app: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: 3306 }]
