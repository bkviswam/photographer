apiVersion: apps/v1
kind: Deployment
metadata:
  name: photographer
  namespace: {{ target_namespace }}
spec:
  replicas: 1
  selector: { matchLabels: { app: photographer } }
  template:
    metadata: { labels: { app: photographer } }
    spec:
      containers:
        - name: photographer
          image: {{ container_image }}
          env:
            - name: NAMESPACE     ; value: {{ target_namespace }}
            - name: DB_HOST       ; value: postgres
            - name: DB_NAME       ; valueFrom: { secretKeyRef: { name: db-secret, key: DB_NAME } }
            - name: DB_USER       ; valueFrom: { secretKeyRef: { name: db-secret, key: DB_USER } }
            - name: DB_PASSWORD   ; valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
            - name: SPRING_PROFILE; value: {{ spring_profile }}
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: photographer
  namespace: {{ target_namespace }}
spec:
  selector: { app: photographer }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]