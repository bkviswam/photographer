apiVersion: v1
kind: ServiceAccount
metadata: { name: awx-deployer, namespace: awx }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: awx-deployer-crb }
subjects:
  - kind: ServiceAccount
    name: awx-deployer
    namespace: awx
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io